/* ═══ 映射表字段在线编辑：秒回 + 后台队列同步腾讯文档 ═══ */
// 备注中转服务地址（Vercel Serverless，见 vercel_api/index.py）
const RM_CFG=(()=>{const h='https://';const d='tvt-remark-api';const f='.vercel.app';return{api:h+d+f}})();
// 可写字段白名单（与后端 EDITABLE_FIELDS 严格一致；其余字段在弹窗内只读）
const EDITABLE_FIELD_KEYS=['当前老师','退出/曾任老师','类型','上课情况','备注'];
const RM_QUEUE_KEY='tvt-remark-queue';     // 兼容旧队列：{combo_id:{remark,ts,tries,status}}
const RM_FQ_KEY='tvt-fieldqueue-v2';       // {combo_id:{fields:{},ts,tries,status}}
const FIELD_OPTS={
  '类型':['学科辅导','陪伴大使'],
  // 「留空-正常上课」历史选项已与空值合并（全表 0 条在用），统一显示为「未设置（正常上课）」
  '上课情况':['','暂停上课','已退出TVT']
};
function rmQ(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}}
function rmQSave(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function fieldQueue(){return rmQ(RM_FQ_KEY)}
function rmFindCombo(student,teacher){const rows=(DATA.raw&&DATA.raw.rows)||[];return rows.find(r=>r.student===student&&r.teacher===teacher)||rows.find(r=>r.student===student)||null}
function rmPendingKeys(){
  const fq=fieldQueue(), oq=rmQ(RM_QUEUE_KEY);
  const a=Object.keys(fq).filter(k=>fq[k]&&fq[k].status!=='ok');
  const b=Object.keys(oq).filter(k=>oq[k]&&oq[k].status!=='ok');
  return [...new Set([...a,...b])];
}
function rmPendingCount(){return rmPendingKeys().length}
function rmHasError(){const fq=fieldQueue(),oq=rmQ(RM_QUEUE_KEY);return Object.values(fq).some(v=>v&&v.status==='error')||Object.values(oq).some(v=>v&&v.status==='error')}
// 取某条记录「生效值」：本地队列优先（乐观更新），否则回落页面数据
function rmComboValue(combo,field,fallback){
  if(!combo)return fallback||'';
  const cid=combo.combo_id;const q=cid?fieldQueue()[cid]:null;
  if(q&&q.fields&&Object.prototype.hasOwnProperty.call(q.fields,field))return q.fields[field];
  const rows=(DATA.raw&&DATA.raw.rows)||[];
  return rows.some(r=>r===combo)?(combo[field]??fallback??''):(combo[field]??fallback??'');
}
function rmDialogStatus(){
  const cid=window.__rmCid;
  if(!cid)return{cls:'',text:'（缺组合ID，无法同步）'};
  const q=fieldQueue()[cid];
  if(!q)return{cls:'',text:''};
  if(q.status==='ok')return{cls:'ok',text:'已同步到腾讯文档'};
  if(q.status==='error')return{cls:'',text:'本地已存，正在自动重试…'};
  return{cls:'',text:'正在同步…'};
}
// 底部同步状态条：同步中常驻，完成后短暂提示再消失
let rmDoneTimer=null;
function rmShowBar(text,cls){
  let bar=document.getElementById('rmSyncBar');
  if(!bar){bar=document.createElement('div');bar.id='rmSyncBar';document.body.appendChild(bar)}
  bar.className='rm-syncbar'+(cls?' '+cls:'');
  bar.textContent=text;
}
function rmUpdateBar(state){
  const bar=document.getElementById('rmSyncBar');
  if(state==='done'){
    if(rmDoneTimer){clearTimeout(rmDoneTimer);rmDoneTimer=null}
    rmShowBar('✅ 同步已完成','rm-done');
    rmDoneTimer=setTimeout(()=>{const b=document.getElementById('rmSyncBar');if(b&&b.classList.contains('rm-done'))b.remove()},2500);
    return;
  }
  if(rmDoneTimer){clearTimeout(rmDoneTimer);rmDoneTimer=null}
  const n=rmPendingCount();
  if(n<=0){if(bar)bar.remove();return}
  if(state==='error'){rmShowBar('⚠️ 同步未完成，正在自动重试（'+n+' 条）——请保持页面开启','rm-error')}
  else{rmShowBar('⏳ 同步中，请勿关闭页面…（'+n+' 条待同步）','rm-syncing')}
}
function rmRefreshBar(){rmUpdateBar(rmHasError()?'error':'syncing')}
// 核心：把一组字段改动放进队列（秒回），后台批量推送
function rmSaveFields(){
  const cid=window.__rmCid;
  const hint=document.getElementById('rmHint');
  if(!cid){if(hint)hint.textContent='未找到上课组合ID，无法同步；请从分组列表进入重试';return}
  const fields={};
  EDITABLE_FIELD_KEYS.forEach(f=>{const el=document.getElementById('fld-'+f);if(el)fields[f]=(el.value||'').trim()});
  const q=fieldQueue();
  const prev=(q[cid]&&q[cid].fields)||{};
  q[cid]={fields:Object.assign({},prev,fields),ts:Date.now(),tries:0,status:'pending'};
  rmQSave(RM_FQ_KEY,q);
  if(hint)hint.textContent='✅ 已保存（正在后台同步到腾讯文档…）';
  const badge=document.getElementById('rmBadge');
  if(badge){badge.className='dlg-badge';badge.textContent='待同步'}
  rmUpdateBar('syncing');
  rmFlush();
}
// 后台批量同步：pending/error 条目一次推给 /sync
let rmFlushing=false;
async function rmFlush(){
  if(rmFlushing)return; if(navigator.onLine===false)return;
  const fq=fieldQueue(),oq=rmQ(RM_QUEUE_KEY);
  const fItems=Object.keys(fq).filter(k=>fq[k]&&fq[k].status!=='ok');
  const oItems=Object.keys(oq).filter(k=>oq[k]&&oq[k].status!=='ok');
  if(!fItems.length&&!oItems.length){rmRefreshBar();return}
  rmFlushing=true;
  rmUpdateBar('syncing');
  try{
    const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),60000);
    const edits=[...fItems.map(k=>({combo_id:k,fields:fq[k].fields})),
                 ...oItems.map(k=>({combo_id:k,remark:oq[k].remark}))];
    const r=await fetch(RM_CFG.api+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({edits}),signal:ctl.signal});
    clearTimeout(timer);
    const d=await r.json().catch(()=>({}));
    const res=(d&&d.results)||[];
    const rej=(d&&d.rejected)||[];
    const q2=fieldQueue(),o2=rmQ(RM_QUEUE_KEY);
    // 【D4 配套】被服务端白名单拒绝的字段：直接剔除，标记为永久失败不再重试。
    // 否则它会被当作「未返回结果」永远 error + 指数退避重试，而重试注定失败。
    const rejectedKeys=[];
    rej.forEach(x=>{
      if(!x||!x.combo_id)return;
      rejectedKeys.push(x.field);
      if(q2[x.combo_id]&&q2[x.combo_id].fields){delete q2[x.combo_id].fields[x.field]}
      if(!q2[x.combo_id]||!Object.keys(q2[x.combo_id].fields||{}).length){delete q2[x.combo_id]}
    });
    if(rejectedKeys.length){window.__rmRejected=[...new Set(rejectedKeys)]}
    res.forEach(x=>{
      if(!x||!x.combo_id)return;
      const tgt=q2[x.combo_id]||o2[x.combo_id];
      if(!tgt)return;
      if(x.verified){tgt.status='ok';tgt.tries=0}
      else{tgt.status='error';tgt.tries=(tgt.tries||0)+1}
    });
    const markMissing=(q,items)=>{items.forEach(k=>{if(q[k]&&q[k].status!=='ok'&&!res.find(x=>x&&x.combo_id===k)){q[k].status='error';q[k].tries=(q[k].tries||0)+1}})};
    markMissing(q2,fItems);markMissing(o2,oItems);
    rmQSave(RM_FQ_KEY,q2);rmQSave(RM_QUEUE_KEY,o2);
  }catch(e){
    const q2=fieldQueue(),o2=rmQ(RM_QUEUE_KEY);
    const bump=(q,items)=>items.forEach(k=>{if(q[k]){q[k].status='error';q[k].tries=(q[k].tries||0)+1}});
    bump(q2,fItems);bump(o2,oItems);
    rmQSave(RM_FQ_KEY,q2);rmQSave(RM_QUEUE_KEY,o2);
  }finally{
    rmFlushing=false;
    const hint=document.getElementById('rmHint'),badge=document.getElementById('rmBadge');
    const cid=window.__rmCid;
    const rj=window.__rmRejected||[];window.__rmRejected=null;
    if(cid&&hint){
      const st=rmDialogStatus();
      if(rj.length)hint.textContent='⚠️ 字段「'+rj.join('、')+'」的值不在表格允许范围内，已忽略；其余修改已保存';
      else if(st.text==='已同步到腾讯文档')hint.textContent='✅ 已同步到腾讯文档表格';
      else if(st.text)hint.textContent='⚠️ 尚未同步成功，已本地保存，稍后自动重试';
      if(badge){badge.className='dlg-badge'+(st.cls==='ok'?' ok':'');badge.textContent=st.text}
      // 全部同步完成后禁用保存按钮，直到下一次改动
      const sb=document.getElementById('rmSave');
      if(sb&&st.cls==='ok')sb.disabled=true;
    }
    const remain=rmPendingCount();
    if(remain<=0){
      rmUpdateBar('done');
    }else{
      rmUpdateBar(rmHasError()?'error':'syncing');
      const all=[...Object.values(fieldQueue()),...Object.values(rmQ(RM_QUEUE_KEY))];
      const maxTries=Math.max(0,...all.map(v=>v.tries||0));
      const delay=Math.min(60000,3000*Math.pow(2,Math.min(4,Math.max(0,maxTries-1))));
      setTimeout(rmFlush,delay);
    }
  }
}

}
if(matchMedia('(max-width:680px)').matches){const chart=$('trendChart');requestAnimationFrame(()=>chart.scrollLeft=chart.scrollWidth)}
const observer=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+e.target.id))}})},{rootMargin:'-20% 0px -60% 0px'});['overview','follow','students'].forEach(id=>observer.observe($(id)));
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(renderMerged,150)});
$('mergedList').addEventListener('click',e=>{if(e.target.closest('.mg-cell'))return;const row=e.target.closest('[data-open]');if(!row)return;const r=MERGED[Number(row.dataset.open)];openDetail(r.student,r.teacher,r.type,r.remark,r.suspend_reason||r.weekly_summary)});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#rmSave');if(!b)return;rmSaveFields()});
$('dialogClose').onclick=()=>$('studentDialog').close();
$('studentDialog').addEventListener('click',e=>{if(e.target===$('studentDialog')){const r=$('studentDialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('studentDialog').close()}});
render();
</script>
</body>
</html>
