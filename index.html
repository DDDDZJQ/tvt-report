  <script>
    const site = JSON.parse(document.getElementById('dashboard-data').textContent);
    const reports = site.reports || [];
    let data = reports[0];
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const typeClass = (type) => type === '陪伴大使' ? 'pb' : 'xk';
    const rateClass = (rate) => rate >= 70 ? 'good' : rate >= 40 ? 'mid' : 'low';

    $('reportSelect').innerHTML = reports.map((r, idx) => `<option value="${idx}">${esc(r.section_title)}｜${esc(r.week_start)} 至 ${esc(r.week_end)}</option>`).join('');
    $('reportSelect').addEventListener('change', () => renderDashboard(reports[Number($('reportSelect').value)]));

    function renderDashboard(report) {
      data = report;
      document.title = `${data.title} - ${data.section_title}`;
      $('pageTitle').textContent = data.title;
      $('pageSubtitle').textContent = `当前统计周期：${data.week_start} 至 ${data.week_end}。页面默认展示最新一周，右上角可切换历史周报。`;
      $('heroMeta').innerHTML = [
        ['报告章节', data.section_title],
        ['页面更新', site.updated_at],
        ['历史期数', `${reports.length} 期`]
      ].map(([label, value]) => `<div class="meta-item"><div class="meta-label">${esc(label)}</div><div class="meta-value">${esc(value)}</div></div>`).join('');
      $('scoreRing').style.setProperty('--rate', data.metrics.completion_rate);
      $('scoreNumber').textContent = `${data.metrics.completion_rate}%`;

      const metricItems = [
        ['目标小组', data.metrics.groups_total, `学生-老师小组：${data.metrics.student_teacher_groups}`, ''],
        ['已上课', data.metrics.completed, `本周完成 ${data.metrics.completion_rate}%`, 'color:var(--good)'],
        ['未上课', data.metrics.not_completed, '含无记录和未闭环流程', 'color:var(--bad)'],
        ['需关注', data.metrics.abnormal_total, `长期频率过低 ${data.metrics.long_term_low_total} 个`, 'color:var(--warn)'],
      ];
      $('metrics').innerHTML = metricItems.map(([label,value,hint,style]) => `<div class="metric"><div class="label">${esc(label)}</div><div class="value" style="${style}">${esc(value)}</div><div class="hint">${esc(hint)}</div></div>`).join('');
      renderChart();
      renderTabs();
      renderAlertPanels();
      renderTable();
    }

    function renderChart() {
      $('groupChart').innerHTML = data.group_cards.map(g => {
        const donePct = g.total ? Math.round(g.completed / g.total * 100) : 0;
        const missPct = Math.max(0, 100 - donePct);
        return `<div class="chart-row"><div class="chart-label">${esc(g.label)}</div><div class="stack" title="完成率 ${donePct}%"><div class="stack-done" style="width:${donePct}%"></div><div class="stack-miss" style="width:${missPct}%"></div></div><div class="chart-value">${g.completed}/${g.total}</div></div>`;
      }).join('');
    }

    function renderTabs() {
      $('groupTabs').innerHTML = data.group_cards.map((g, idx) => `<button class="tab ${idx === 0 ? 'active' : ''}" data-index="${idx}">${esc(g.label)}</button>`).join('');
      $('groupTabs').onclick = (event) => {
        const btn = event.target.closest('button[data-index]');
        if (!btn) return;
        document.querySelectorAll('.tab').forEach(item => item.classList.remove('active'));
        btn.classList.add('active');
        renderGroupDetail(Number(btn.dataset.index));
      };
      renderGroupDetail(0);
    }

    function renderGroupDetail(index) {
      const g = data.group_cards[index];
      if (!g) { $('groupDetail').innerHTML = ''; return; }
      $('groupDetail').innerHTML = `<div class="group-cards"><div class="group-card"><div class="group-head"><div><div class="group-name">${esc(g.label)}</div><div class="small">${esc(g.time)}</div></div><div class="rate-pill">完成率 ${g.rate}%</div></div>${g.sections.map(sec => `<div class="section-row"><div><span class="tag ${typeClass(sec.type)}">${esc(sec.type)}</span></div><div class="mini-bar"><div class="mini-fill ${rateClass(sec.rate)}" style="width:${sec.rate}%"></div></div><div class="small">${sec.completed}/${sec.total}</div></div><div class="missing">${sec.not_completed.length ? '未上课：' + esc(sec.not_completed.join('；')) : '未上课：无'}</div>`).join('')}</div></div>`;
    }

    function renderAlertList(targetId, items, emptyText) {
      const target = $(targetId);
      if (!items.length) { target.innerHTML = `<li><div><span class="dot amber"></span>${esc(emptyText)}</div></li>`; return; }
      target.innerHTML = items.map(item => `<li><div class="insight-top"><div><span class="dot ${item.type === '陪伴大使' ? 'amber' : ''}"></span><span class="tag ${typeClass(item.type)}">${esc(item.type)}</span></div><span class="small">${esc(item.label)}</span></div><div style="font-weight:700">${esc(item.group)}</div><div class="small">${esc(item.reason)}${item.weekly_summary ? '；本期情况：' + esc(item.weekly_summary) : ''}</div></li>`).join('');
    }

    function renderAlertPanels() {
      $('abnormalCount').textContent = `${data.abnormal.length} 个`;
      $('lowCount').textContent = `${data.long_term_low.length} 个`;
      renderAlertList('abnormalList', data.abnormal, '本周未发现达到明确异常标准的小组。');
      renderAlertList('lowList', data.long_term_low, '暂未发现长期频率过低小组。');
      $('dataNotes').innerHTML = `另有 <strong>${data.unmatched_total}</strong> 条记录未能按备注页老师精确归组，建议后续核对。固定访问入口不变，每周只覆盖更新本页内容。`;
    }

    function statusTag(row) {
      if (row.long_term_level === 'low') return '<span class="tag danger">长期频率过低</span>';
      if (row.weekly_done) return '<span class="tag done">本周已上课</span>';
      return '<span class="tag warn">本周未上课</span>';
    }

    function renderTable() {
      const keyword = $('searchInput').value.trim().toLowerCase();
      const type = $('typeFilter').value;
      const status = $('statusFilter').value;
      const rows = data.all_groups.filter(row => {
        const haystack = `${row.label} ${row.type} ${row.student} ${row.teacher} ${row.weekly_summary}`.toLowerCase();
        if (keyword && !haystack.includes(keyword)) return false;
        if (type !== '全部类型' && row.type !== type) return false;
        if (status === '本周已上课' && !row.weekly_done) return false;
        if (status === '本周未上课' && row.weekly_done) return false;
        if (status === '长期频率过低' && row.long_term_level !== 'low') return false;
        return true;
      });
      $('tableCount').textContent = `${rows.length} 条`;
      $('groupTable').innerHTML = rows.map(row => `<tr><td>${esc(row.label)}</td><td><span class="tag ${typeClass(row.type)}">${esc(row.type)}</span></td><td>${esc(row.name)}</td><td>${statusTag(row)}<div class="small">${esc(row.weekly_summary)}</div></td><td>${esc(row.last_completed || '暂无')}</td><td>${esc(row.long_term_reason || '正常')}</td></tr>`).join('');
    }

    ['searchInput','typeFilter','statusFilter'].forEach(id => $(id).addEventListener('input', renderTable));
    if (data) renderDashboard(data);
  </script>
</body>
</html>
